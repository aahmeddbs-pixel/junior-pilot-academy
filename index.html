<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junior Pilot Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12324f;--navy:#1d3f72;--sky:#5ec2ff;--sun:#ffc93c;--orange:#ff8a3d;--green:#22b566;--red:#ef4d56;--card:#ffffff;--soft:#eef7ff;--shadow:0 6px 0 rgba(18,50,79,.12),0 10px 24px rgba(18,50,79,.12)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(180deg,#46aef0 0%,#9fdcff 45%,#e6f6ff 100%);background-attachment:fixed;min-height:100vh;font-size:18px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
.bgclouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgclouds span{position:absolute;font-size:90px;opacity:.55;animation:bgdrift linear infinite;filter:drop-shadow(0 4px 0 rgba(255,255,255,.4))}
@keyframes bgdrift{from{transform:translateX(110vw)}to{transform:translateX(-30vw)}}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(18,50,79,.92);color:#fff;backdrop-filter:blur(6px)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;text-decoration:none;color:#fff}
.logo b{color:var(--sun)}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{background:rgba(255,255,255,.14);padding:5px 12px;border-radius:999px;font-weight:600;font-size:16px;white-space:nowrap}
.chip.rank{background:var(--sun);color:var(--ink)}
.rankbar{width:110px;height:12px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.rankbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--orange));border-radius:9px;transition:width .6s}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:20px;border-radius:12px;width:42px;height:38px}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 14px 80px}
/* cards & buttons */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin:16px 0}
.pad{padding:18px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 20px;font-size:18px;font-weight:600;background:var(--orange);color:#fff;text-decoration:none;box-shadow:0 5px 0 #c9621f;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9621f}
.btn.alt{background:#3b82f6;box-shadow:0 5px 0 #2357b0}
.btn.green{background:var(--green);box-shadow:0 5px 0 #168048}
.btn.grey{background:#8796a8;box-shadow:0 5px 0 #5f6d7d}
.btn.sm{font-size:16px;padding:8px 14px;border-radius:12px}
.btn.big{font-size:20px;padding:14px 24px}
.btn.done{background:var(--green);box-shadow:0 5px 0 #168048}
.say{border:0;background:#e3f1ff;border-radius:10px;font-size:18px;padding:2px 8px;vertical-align:middle}
.row{display:flex;flex-wrap:wrap;align-items:center}
.gap{gap:10px}
.hidden{display:none!important}
.muted{color:#5c7690}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--soft);border-radius:18px;padding:14px 16px;border:3px solid transparent}
.tile h3{font-size:20px}
.tile .ic{font-size:40px}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,#fff 0%,#eaf6ff 100%);border-radius:28px;box-shadow:var(--shadow);padding:22px 24px;overflow:hidden}
.hero h1{font-size:34px}
.hero .hl{color:var(--orange)}
.fact{background:#fff7dc;border:3px dashed var(--sun);border-radius:18px;padding:12px 16px;margin-top:12px}
.sec{color:#fff;text-shadow:0 2px 0 rgba(18,50,79,.35);font-size:28px;margin:26px 4px 6px}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.mission{position:relative;display:flex;flex-direction:column;gap:2px;text-decoration:none;background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);border-bottom:8px solid var(--c);transition:transform .15s}
.mission:hover{transform:translateY(-4px) rotate(-.5deg)}
.mission .micon{font-size:46px}
.mission b{font-size:20px}
.mission small{color:#5c7690;font-size:15px}
.mission .num{position:absolute;top:10px;right:12px;background:var(--c);color:#fff;font-weight:700;border-radius:999px;width:30px;height:30px;display:grid;place-items:center;font-size:16px}
.mission .tick{position:absolute;top:44px;right:10px;font-size:22px}
/* lesson head */
.lesson-head{display:flex;gap:16px;align-items:center;background:var(--c);color:#fff;border-radius:24px;padding:16px 20px;box-shadow:var(--shadow)}
.lesson-head h1{font-size:30px}
.lesson-head p{margin:0;font-size:18px}
.lh-icon{font-size:60px;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px}
.back{color:#fff;text-decoration:none;background:rgba(0,0,0,.18);padding:8px 12px;border-radius:12px;font-weight:600;white-space:nowrap;align-self:flex-start}
.learned-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:24px 0}
/* parts */
.parts-wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.parts-wrap .card{margin:0}
svg.plane{width:100%;height:auto;display:block;margin-top:8px}
.hot{cursor:pointer;transition:filter .15s}
.hot:hover,.hot.sel{filter:drop-shadow(0 0 6px #ffb703) brightness(1.08)}
.hot.sel path,.hot.sel rect,.hot.sel circle,.hot.sel ellipse{stroke:#ff8a3d!important;stroke-width:4!important}
.lbl{display:none;font-size:15px;font-weight:600;fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:5px;pointer-events:none}
.show-labels .lbl{display:block}
.info .big-emoji{font-size:54px}
.findbar{background:#fff1d6;border-radius:14px;padding:10px 14px;font-size:20px;font-weight:600;margin-top:10px}
/* types */
.acard{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:12px;text-align:center;cursor:pointer;border:0;font-size:inherit;color:inherit;transition:transform .15s}
.acard:hover{transform:translateY(-4px)}
.acard svg{width:100%;height:110px}
.acard b{display:block;font-size:19px}
.acard small{color:#5c7690}
.speedrow{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:6px 0;font-size:16px}
.speedbar{height:22px;border-radius:12px;background:linear-gradient(90deg,#5ec2ff,#3b5bdb);transform-origin:left;animation:barin 1.2s ease-out both}
@keyframes barin{from{transform:scaleX(0)}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,30,50,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;border-radius:26px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal ul{padding-left:20px}
.modal li{margin:6px 0}
.avatars{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.avatars button{font-size:36px;background:#eef7ff;border:3px solid transparent;border-radius:16px;padding:4px 10px}
.avatars button.on{border-color:var(--orange);background:#fff3e6}
input.txt{font-family:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid #bcd6ee;width:100%;max-width:360px}
input.txt:focus{outline:none;border-color:var(--orange)}
/* toast + confetti */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-weight:600;z-index:60;animation:toastin .3s ease, toastout .4s ease 2.2s forwards;box-shadow:0 8px 20px rgba(0,0,0,.25)}
@keyframes toastin{from{transform:translate(-50%,30px);opacity:0}}
@keyframes toastout{to{transform:translate(-50%,30px);opacity:0}}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:70;pointer-events:none;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* quiz */
.qcard{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:22px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qprog{flex:1;min-width:140px;height:14px;background:#e3eef8;border-radius:9px;overflow:hidden}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7bd88f);transition:width .4s}
.qtext{font-size:26px;font-weight:600;margin:16px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:500;text-align:left;color:#fff;display:flex;gap:10px;align-items:center;min-height:70px;transition:transform .1s,opacity .2s}
.opt:hover{transform:scale(1.02)}
.opt .k{background:rgba(255,255,255,.3);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-weight:700;flex:none}
.opt:nth-child(1){background:#3b82f6}.opt:nth-child(2){background:#8b5cf6}.opt:nth-child(3){background:#f59e0b}.opt:nth-child(4){background:#ec4899}
.opt.right{background:var(--green)!important;transform:scale(1.03)}
.opt.wrong{background:var(--red)!important}
.opt.dim{opacity:.4}
.explain{margin-top:16px;border-radius:16px;padding:14px 16px;font-size:19px}
.explain.ok{background:#e3f9ec;border:3px solid var(--green)}
.explain.no{background:#fff0f0;border:3px solid var(--red)}
/* maths */
.mq{font-size:26px;font-weight:600;margin:10px 0 16px}
.ansbox{font-size:34px;font-weight:700;min-width:200px;text-align:center;padding:8px 16px;border-radius:16px;border:4px solid #bcd6ee;background:#f7fbff;letter-spacing:2px}
.keypad{display:grid;grid-template-columns:repeat(4,72px);gap:10px;margin:14px auto;justify-content:center}
.keypad button{height:62px;border:0;border-radius:16px;font-size:28px;font-weight:700;background:#e3f1ff;color:var(--ink);box-shadow:0 4px 0 #b8d3ec}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8d3ec}
.keypad .ok{background:var(--green);color:#fff;box-shadow:0 4px 0 #168048}
.keypad .del{background:#ffd9d9}
.lvl{border:0;text-align:left;font-size:inherit;color:inherit}
.lvl.on{border-color:var(--orange);background:#fff3e6}
.streak{font-size:22px;font-weight:700}
/* movies */
.stage{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:16/9}
.stage svg{width:100%;height:100%;display:block}
.caption{font-size:22px;font-weight:500;min-height:70px;margin:12px 4px}
.mvbar{height:8px;background:#e3eef8;border-radius:6px;overflow:hidden}
.mvbar i{display:block;height:100%;width:0;background:var(--orange)}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots span{width:12px;height:12px;border-radius:50%;background:#cfe0f0}
.dots span.on{background:var(--orange)}
/* movie animations */
.mv-pulse{animation:mvpulse 1s ease-in-out infinite}
@keyframes mvpulse{50%{opacity:.25}}
.mv-dash{animation:mvdash .3s linear infinite}
.mv-dash.slow{animation-duration:.7s}
@keyframes mvdash{to{transform:translateX(-80px)}}
.mv-shake{animation:mvshake .14s linear infinite}
@keyframes mvshake{50%{transform:translateY(1.5px)}}
.mv-rotate{transform-box:fill-box;transform-origin:45% 100%;animation:mvrot 2.5s ease-in-out .8s forwards}
@keyframes mvrot{to{transform:rotate(-12deg)}}
.mv-climb{animation:mvclimb 7s ease-in forwards}
@keyframes mvclimb{to{transform:translate(420px,-10px)}}
.gearup .gear{transform-box:fill-box;transform-origin:50% 0;animation:mvgear 1s ease 1.8s forwards}
@keyframes mvgear{to{transform:scaleY(0);opacity:0}}
.mv-sink{animation:mvsink 7s ease-in forwards}
@keyframes mvsink{to{transform:translateY(150px)}}
.mv-drift{animation:mvdrift 9s linear infinite}
.mv-drift.fast{animation-duration:5s}
@keyframes mvdrift{to{transform:translateX(-640px)}}
.mv-bob{animation:mvbob 2.2s ease-in-out infinite}
@keyframes mvbob{50%{transform:translateY(-8px)}}
.mv-flow{stroke-dasharray:14 18;animation:mvflow 1.3s linear infinite}
.mv-flow.fast{animation-duration:.6s}
@keyframes mvflow{to{stroke-dashoffset:-64}}
.mv-grow{transform-box:fill-box;transform-origin:50% 100%;animation:mvgrow 2s ease-out .6s both}
@keyframes mvgrow{from{transform:scaleY(0)}}
.mv-appear{opacity:0;animation:mvappear .6s ease forwards}
@keyframes mvappear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mv-walk{animation:mvwalk 8s linear forwards}
@keyframes mvwalk{to{transform:translateX(400px)}}
.mv-ripple{transform-box:fill-box;transform-origin:center;animation:mvripple 1.6s ease-out infinite}
@keyframes mvripple{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.mv-land{animation:mvland 6s ease-out forwards}
@keyframes mvland{from{transform:translate(-300px,-160px)}to{transform:translate(0,0)}}
.mv-fadeout{animation:mvfo 1.5s ease 2.5s forwards}
@keyframes mvfo{to{opacity:0}}
.mv-fadein{opacity:0;animation:mvfi 1.5s ease 2.5s forwards}
@keyframes mvfi{to{opacity:1}}
.mv-tilt{transform-box:fill-box;transform-origin:center;animation:mvtilt 3s ease-in-out infinite}
@keyframes mvtilt{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.mv-roll{transform-box:fill-box;transform-origin:center;animation:mvroll 3s ease-in-out infinite}
@keyframes mvroll{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
.mv-yaw{transform-box:fill-box;transform-origin:center;animation:mvyaw 3s ease-in-out infinite}
@keyframes mvyaw{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.prop{transform-box:fill-box;transform-origin:center;animation:mvprop .12s linear infinite}
@keyframes mvprop{50%{transform:scaleY(.15)}}
.rotor{transform-box:fill-box;transform-origin:center;animation:mvrotor .22s linear infinite}
@keyframes mvrotor{50%{transform:scaleX(.15)}}
.spin{transform-box:fill-box;transform-origin:center;animation:mvspin .3s linear infinite}
@keyframes mvspin{to{transform:rotate(360deg)}}
.flame{transform-box:fill-box;transform-origin:right center;animation:mvflame .15s linear infinite}
@keyframes mvflame{50%{transform:scaleX(.6)}}
.heroplane{animation:mvbob 3s ease-in-out infinite}
/* forces */
.slider{width:100%;accent-color:var(--orange);height:30px}
.status{font-size:22px;font-weight:700;padding:10px 14px;border-radius:14px;background:#eef7ff;text-align:center}
.chal{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:#f3f8fd;margin:6px 0}
.chal.ok{background:#e3f9ec}
/* timeline */
.timeline{position:relative;padding-left:34px}
.timeline:before{content:'';position:absolute;left:14px;top:8px;bottom:8px;width:6px;border-radius:4px;background:repeating-linear-gradient(180deg,var(--orange) 0 14px,transparent 14px 24px)}
.tstep{position:relative;background:var(--soft);border-radius:18px;padding:12px 16px;margin:12px 0}
.tstep:before{content:attr(data-i);position:absolute;left:-34px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.tstep b{font-size:20px}
.tag{display:inline-block;background:var(--sun);border-radius:999px;padding:1px 10px;font-size:14px;font-weight:600;margin-right:6px}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;border-radius:14px;padding:10px 16px;font-size:18px;font-weight:600;background:#e3f1ff;color:var(--ink)}
.tabs button.on{background:var(--navy);color:#fff}
.phon{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.phon span{background:#1d3f72;color:#fff;border-radius:12px;padding:6px 12px;font-weight:600;animation:pop .3s ease both}
.phon span em{font-style:normal;color:var(--sun);font-size:22px;margin-right:4px}
.alphagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;font-size:16px}
.alphagrid div{background:#eef7ff;border-radius:10px;padding:6px 8px;cursor:pointer}
.alphagrid b{color:var(--orange);font-size:20px}
.chk{display:flex;flex-direction:column;gap:8px;max-width:480px}
.chk button{border:0;border-radius:14px;padding:12px;font-size:19px;background:#eef7ff;color:var(--ink);text-align:left}
.chk button.done{background:var(--green);color:#fff}
.chk button.bad{animation:shakex .4s}
@keyframes shakex{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* game */
.gamewrap{position:relative;background:#000;border-radius:20px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,30,60,.55);color:#fff;text-align:center;padding:20px}
.overlay h2{font-size:34px}
.gctl{display:flex;gap:12px;justify-content:center;margin-top:12px}
.gctl button{width:110px;height:70px;font-size:34px;border:0;border-radius:18px;background:#fff;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;touch-action:none}
/* hangar */
.badge{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.badge .bi{font-size:44px}
.badge.locked{filter:grayscale(1);opacity:.45}
.badge b{display:block;font-size:16px}
.badge small{font-size:13px;color:#5c7690}
.licence{background:linear-gradient(135deg,#1d3f72,#2a5aa0);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden;box-shadow:var(--shadow);max-width:560px;margin:0 auto}
.licence:after{content:'✈';position:absolute;right:-10px;bottom:-40px;font-size:200px;opacity:.12}
.licence h2{color:var(--sun);letter-spacing:1px}
.licence .av{font-size:70px;background:rgba(255,255,255,.15);border-radius:18px;padding:4px 14px}
.ranks{display:flex;gap:6px;flex-wrap:wrap}
.ranks span{padding:6px 12px;border-radius:999px;background:#e3eef8;font-weight:600;font-size:15px}
.ranks span.on{background:var(--sun)}
.footer{color:#4a6580;text-align:center;font-size:14px;margin-top:30px}
.mv-push{animation:mvpush 6s ease-in-out 1s forwards}
@keyframes mvpush{to{transform:translateX(160px)}}
.mv-turb{animation:mvturb 1.3s linear infinite}
@keyframes mvturb{0%,100%{transform:translate(0,0)}20%{transform:translate(2px,-7px)}40%{transform:translate(-2px,5px)}60%{transform:translate(1px,-4px)}80%{transform:translate(-1px,6px)}}
.keypad span{display:block}
.inst{width:100%;max-width:220px;display:block;margin:0 auto}
.cockpit{background:linear-gradient(180deg,#1d2b3a,#2b3b50);color:#fff}
.cockpit .chal{background:rgba(255,255,255,.12);color:#fff}.cockpit .chal.ok{background:rgba(34,181,102,.5)}
.cockpit .status{background:rgba(255,255,255,.12);color:#fff}
.cockpit .grid4 b{color:#cfe3f7;font-size:15px}
.cityDot:hover circle{r:9}
.vcard{background:var(--soft);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.vcard b{font-size:19px}.vcard p{margin:4px 0}
.vwrap{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vthumb{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#12324f,#3b5bdb);display:grid;place-items:center;text-decoration:none;color:#fff;position:relative}
.vthumb span{width:74px;height:74px;border-radius:50%;background:#ef4d56;display:grid;place-items:center;font-size:34px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.vthumb em{position:absolute;bottom:10px;font-style:normal;font-weight:600}
.vlink{font-weight:600;color:#3b5bdb}
@media (max-width:760px){
 .hero{grid-template-columns:1fr}
 .parts-wrap{grid-template-columns:1fr}
 .opts{grid-template-columns:1fr}
 .speedrow{grid-template-columns:110px 1fr 84px;font-size:14px}
 .lesson-head{flex-wrap:wrap}
 .lh-icon{font-size:44px}
 .lesson-head h1{font-size:24px}
 .rankbar{display:none}
 .qtext,.mq{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.bgclouds span{animation:none}}
</style>
</head>
<body>
<div class="bgclouds"><span style="top:12%;animation-duration:70s">☁️</span><span style="top:38%;animation-duration:95s;animation-delay:-40s">☁️</span><span style="top:66%;animation-duration:80s;animation-delay:-20s">☁️</span></div>
<header class="top">

function cloud(x,y,s=1,op=1){return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><ellipse cx="0" cy="0" rx="40" ry="18" fill="#fff"/><ellipse cx="-26" cy="6" rx="26" ry="14" fill="#fff"/><ellipse cx="28" cy="6" rx="26" ry="13" fill="#fff"/><ellipse cx="4" cy="-12" rx="22" ry="16" fill="#fff"/></g>`}
const SKY=(a='#4fb0ef',b='#cdefff',id='sk')=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="640" height="360" fill="url(#${id})"/>`;
const BUBBLE=(x,y,w,txt,delay=0,fs=18)=>`<g transform="translate(${x} ${y})"><g class="mv-appear" style="animation-delay:${delay}s"><rect width="${w}" height="46" rx="14" fill="#fff" stroke="#12324f" stroke-width="2"/><text x="${w/2}" y="30" text-anchor="middle" font-size="${fs}" font-family="Fredoka,sans-serif" fill="#12324f" font-weight="600">${txt}</text></g></g>`;

let cleanup=null;
function lessonHead(m,intro){return `<div class="lesson-head" style="--c:${m.color};background:${m.color}"><a href="#home" class="back">⬅ Map</a><div class="lh-icon">${m.icon}</div><div><h1>${m.title}</h1><p>${intro} ${sayBtn(intro)}</p></div></div>`}
function learnedBtn(id,quiz){const done=S.learned[id];return videoCards(id)+`<div class="learned-row"><button class="btn big ${done?'done':'green'}" data-learn="${id}">${done?'✅ Mission learned!':"✅ I've learned this! (+3 ⭐)"}</button>${quiz?`<a class="btn big alt" href="#quiz-${quiz}">🏆 Take the quiz</a>`:''}<a class="btn big grey" href="#home">🗺️ Back to map</a></div>`}

// ---------- HOME ----------
function viewHome(){
 const learnedCount=LESSONS.filter(k=>S.learned[k]).length;
 const ms=MISSIONS.map((m,i)=>`<a class="mission" href="#${m.id}" style="--c:${m.color}"><span class="num">${i+1}</span><span class="micon">${m.icon}</span><b>${m.title}</b><small>${m.sub}</small>${S.learned[m.id]?'<span class="tick">✅</span>':''}</a>`).join('');
 const r=rankOf(S.stars),n=nextRank(S.stars);
 app.innerHTML=`<section class="hero">
  <div><h1>Welcome aboard,<br><span class="hl">${S.avatar} ${esc(pname())}</span>!</h1>
  <p style="font-size:20px">This is <b>your</b> flight school. Explore the missions, collect ⭐ stars, earn badges and climb the ranks from <b>Cadet</b> all the way to <b>Captain</b>!</p>
  <p class="muted">Rank: <b>${r[2]} ${r[1]}</b> · ${n?`${n[0]-S.stars} more ⭐ to become <b>${n[1]}</b>`:'You reached the top rank!'} · Missions learned: <b>${learnedCount}/${LESSONS.length}</b></p>
  <div class="fact"><b>✨ Did you know?</b> <span id="factTxt"></span> <button class="say" id="factSay">🔊</button><br><button class="btn sm" id="factBtn" style="margin-top:8px">Another fact ✈️</button></div></div>
  <div><svg viewBox="0 0 400 260" style="width:100%">${cloud(80,60,.9)}${cloud(320,90,.7)}${cloud(200,210,1.1,.9)}<g transform="translate(90 80) scale(1.1)"><g class="heroplane">${planeG('#fff','#ff8a3d')}</g></g><text x="300" y="50" font-size="40" class="mv-bob">☀️</text></svg>
  <div class="center"><a class="btn big" href="#${(MISSIONS.find(m=>LESSONS.includes(m.id)&&!S.learned[m.id])||M('maths')).id}">🚀 ${learnedCount?'Continue':'Start'} my next mission</a></div></div>
 </section>
 <h2 class="sec">🗺️ Your Flight Map</h2><div class="missions">${ms}</div>
 <p class="footer">Junior Pilot Academy · Progress saves on this device · Grown-ups: new missions can be added any time.</p>`;
 const showFact=()=>{const f=pick(FACTS);$('#factTxt').textContent=f;$('#factSay').dataset.say=f};
 showFact();$('#factBtn').onclick=showFact;
}

 let game=null;

 $$('.hot',svg).forEach(h=>h.addEventListener('click',()=>{const k=h.dataset.p;
  if(game){const want=game.list[game.i];if(k===want){game.score++;beep('ok');toast('✅ Correct!')}else{beep('no');toast(`❌ That was the ${PARTS[k].name}`)}showPart(want);game.i++;nextFind();return}
  showPart(k);if(S.sound)speak(PARTS[k].name)}));
 function nextFind(){const bar=$('#findBar');if(game.i>=game.list.length){bar.innerHTML=`🏁 You found <b>${game.score}/6</b> parts! ${game.score===6?'Perfect! 🌟':'Practise and try again!'}`;bestScore('finder',game.score,s=>s);if(game.score===6)award('finder');game=null;$('#findBtn').textContent='🎯 Play again';return}

function gRadio(){

  const k=rnd(0,25),mode=rnd(0,1);const right=mode?ALPHA[k]:String.fromCharCode(65+k);const wrong=shuffle(ALPHA.map((w,j)=>j).filter(j=>j!==k)).slice(0,3).map(j=>mode?ALPHA[j]:String.fromCharCode(65+j));const opts=shuffle([right,...wrong]);

 function cloudC(x,y,s,c){cx.fillStyle=c;[[0,0,40,18],[-26,6,26,14],[28,6,26,13],[4,-12,22,16]].forEach(e=>{cx.beginPath();cx.ellipse(x+e[0]*s,y+e[1]*s,e[2]*s,e[3]*s,0,0,7);cx.fill()})}

 function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;const s=st;
  // input

  [[100,80,.8],[420,140,.6],[700,60,.9],[260,360,.7],[600,330,.8]].forEach(c=>cloudC(((c[0]-s.bg*c[2])%900+900)%900-50,c[1],c[2],'rgba(255,255,255,.7)'));
  for(const o of s.objs){if(o.type==='ring'){cx.lineWidth=8;cx.strokeStyle=o.hit?'#22b566':'#ffc93c';cx.beginPath();cx.ellipse(o.x,o.y,14,42,0,0,7);cx.stroke()}else if(o.type==='star')starC(o.x,o.y,16);else{cloudC(o.x,o.y,1,'#5d6878');cx.fillStyle='#ffd93c';cx.beginPath();cx.moveTo(o.x-4,o.y+12);cx.lineTo(o.x+8,o.y+12);cx.lineTo(o.x,o.y+26);cx.lineTo(o.x+10,o.y+26);cx.lineTo(o.x-8,o.y+46);cx.lineTo(o.x-2,o.y+30);cx.lineTo(o.x-10,o.y+30);cx.fill()}}

  cx.fillStyle='rgba(18,50,79,.75)';cx.fillRect(10,10,320,44);cx.fillStyle='#fff';cx.font='600 24px Fredoka, sans-serif';cx.fillText(`⭐ ${s.score}   ⏱ ${Math.ceil(Math.max(0,s.time))}   ${'❤️'.repeat(Math.max(0,s.lives))}`,22,41);
  if(s.time<=0||s.lives<=0)return end();

 function end(){st.run=false;const sc=st.score;const nb=bestScore('game',sc,v=>Math.min(10,Math.floor(v/20)));if(sc>=150)award('topgun');

 $('#gstart').onclick=go;
 const kd=e=>{if(['ArrowUp','w','W'].includes(e.key)){keys.up=1;e.preventDefault()}if(['ArrowDown','s','S'].includes(e.key)){keys.dn=1;e.preventDefault()}};

// ---------- shared mini-game helpers ----------
function roundGame(box,rounds,makeQ,onDone){let n=0,score=0;
 const ask=()=>{if(!document.body.contains(box))return;if(n>=rounds){onDone(score,start);return}
  const Q=makeQ(n);box.innerHTML=`<div class="qtext" style="font-size:22px">(${n+1}/${rounds}) ${Q.q}</div><div class="opts">${Q.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span>${o.t}</button>`).join('')}</div><div class="rgx"></div>`;
  $$('.opt',box).forEach(b=>b.onclick=()=>{const o=Q.opts[+b.dataset.j];if(o.ok){score++;beep('ok')}else beep('no');$$('.opt',box).forEach((x,j)=>{x.disabled=true;x.classList.add(Q.opts[j].ok?'right':(x===b?'wrong':'dim'))});n++;
   if(Q.e){$('.rgx',box).innerHTML=`<div class="explain ${o.ok?'ok':'no'}">${o.ok?'✅ Correct! ':'❌ Not quite. '}${Q.e}</div><div class="center" style="margin-top:10px"><button class="btn alt">Next ➡</button></div>`;$('.rgx .btn',box).onclick=ask}else setTimeout(ask,1300)})};
 const start=()=>{n=0;score=0;ask()};start()}
function roundEnd(box,score,rounds,need,key,badge,restart,msgs){const pass=score>=need;box.innerHTML=`<div class="explain ${pass?'ok':'no'}">${pass?'🎉':'💪'} You scored <b>${score}/${rounds}</b>! ${pass?msgs[0]:msgs[1]}</div><div class="center" style="margin-top:10px"><button class="btn alt">🔁 Play again</button></div>`;$('.btn',box).onclick=restart;bestScore(key,score,s=>Math.floor(s/2));if(pass&&badge)award(badge)}
function startBtn(box,label,fn){box.innerHTML=`<button class="btn alt">${label}</button>`;$('.btn',box).onclick=fn}
function uniqOpts(right,cands){const seen=new Set([right]);const out=[{t:right,ok:true}];for(const c of cands){if(out.length>=4)break;if(!seen.has(c)){seen.add(c);out.push({t:c,ok:false})}}return shuffle(out)}
function orderGame(box,steps,intro,onWin){const order=shuffle(steps.map((s,i)=>i));let next=0,mistakes=0;
 box.innerHTML=`<p>${intro}</p><div class="chk">${order.map(i=>`<button data-i="${i}">${steps[i]}</button>`).join('')}</div><p class="muted og-msg"></p>`;
 $$('.chk button',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(b.classList.contains('done'))return;if(i===next){b.classList.add('done');b.textContent=`${next+1}. ${steps[i]}`;next++;beep('ok');if(next===steps.length){$('.og-msg',box).innerHTML=`🎉 All in order${mistakes?` (with ${mistakes} oops)`:' with zero mistakes'}! Brilliant!`;onWin()}}else{mistakes++;beep('no');b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');$('.og-msg',box).textContent='Hmm, what needs to happen before that? Think it through!'}})}

const PT=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return [+(cx+r*Math.cos(a)).toFixed(1),+(cy+r*Math.sin(a)).toFixed(1)]};
const ARC=(r,a1,a2)=>{const [x1,y1]=PT(100,100,r,a1),[x2,y2]=PT(100,100,r,a2);return `M${x1} ${y1} A${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2} ${y2}`};

const T=(x,y,s,txt,fill='#fff',w=700)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="${s}" font-weight="${w}" fill="${fill}">${txt}</text>`;

 const [rx1,ry1]=PT(100,100,72,120),[rx2,ry2]=PT(100,100,88,120);
 return instFrame(`<path d="${ARC(83,-75,90)}" stroke="#22c55e" stroke-width="7" fill="none"/><path d="${ARC(83,90,120)}" stroke="#ffc93c" stroke-width="7" fill="none"/><line x1="${rx1}" y1="${ry1}" x2="${rx2}" y2="${ry2}" stroke="#ef4d56" stroke-width="4"/>${t}${T(100,132,11,'KNOTS','#9cc4f2')}${T(100,80,10,'AIRSPEED','#9cc4f2')}<g class="n1" transform="rotate(${-150+v*1.5} 100 100)"><path d="M96 110 L100 24 L104 110Z" fill="#fff"/></g><circle cx="100" cy="100" r="8" fill="#555"/>`)}

  const nq=()=>{const t=rnd(0,2);if(t===0){const a=rnd(2,12),b=rnd(2,12);q={s:`${a} × ${b}`,a:a*b}}else if(t===1){const a=rnd(10,90),b=rnd(5,60);q={s:`${a} + ${b}`,a:a+b}}else{const a=rnd(30,99),b=rnd(5,a-1);q={s:`${a} − ${b}`,a:a-b}}$('#srQ').textContent=q.s+' = ?';$('#srIn').value='';$('#srIn').focus()};

  const iv=setInterval(()=>{if(!document.body.contains(box)){clearInterval(iv);return}const left=Math.ceil((end-Date.now())/1000);$('#srT').textContent='⏱ '+Math.max(0,left);if(left<=0){clearInterval(iv);const nb=bestScore('speed',score,s=>Math.floor(s/5));if(score>=20)award('speedrun');box.innerHTML=`<div class="explain ok">⚡ Time! You answered <b>${score}</b> correctly. ${nb?'🎉 NEW BEST!':''} ${score>=20?'Lightning-fast pilot brain!':'Keep practising to beat your best!'}</div><div class="center" style="margin-top:10px"><button class="btn" id="srAgain">🔁 Go again</button></div>`;$('#srAgain').onclick=()=>speedRun(box)}},200)};

// ---------- name / avatar ----------
function askName(edit){const avs=['🧑‍✈️','👨‍✈️','👦','🦅','🚀','🐯','🦁','🤖'];let av=S.avatar;
 const mm=modal(`<div class="center"><div style="font-size:60px">✈️</div><h2>${edit?'Edit your pilot profile':'Welcome to Junior Pilot Academy!'}</h2><p>${edit?'':'Every pilot needs a name on their licence. '}What is your name, future Captain?</p><input class="txt" id="nm" maxlength="20" placeholder="Your name" value="${esc(S.name)}"><p style="margin-bottom:0">Pick your pilot picture:</p><div class="avatars" style="justify-content:center">${avs.map(a=>`<button data-a="${a}" class="${a===av?'on':''}">${a}</button>`).join('')}</div><button class="btn big green" id="go">${edit?'Save ✅':"Let's fly! 🛫"}</button></div>`);
 $$('[data-a]',mm).forEach(b=>b.onclick=()=>{av=b.dataset.a;$$('[data-a]',mm).forEach(x=>x.classList.toggle('on',x===b))});
 const done=()=>{const v=$('#nm',mm).value.trim();if(!v){$('#nm',mm).focus();return}S.name=v;S.avatar=av;save();mm.remove();if(!S.badges.cadet){award('cadet');speak(`Welcome aboard, Cadet ${v}! Let's learn to fly!`)}route()};
 $('#go',mm).onclick=done;$('#nm',mm).onkeydown=e=>{if(e.key==='Enter')done()};setTimeout(()=>$('#nm',mm).focus(),100)}

// ---------- router & global clicks ----------
const VIEWS={home:viewHome,parts:viewParts,forces:viewForces,types:viewTypes,weather:viewWeather,airports:viewAirports,instruments:viewInstruments,routes:viewRoutes,space:viewSpace,history:viewHistory,cinema:viewCinema,life:viewLife,skills:viewSkills,school:viewSchool,maths:viewMaths,quiz:viewQuiz,game:viewGame,hangar:viewHangar};
function route(){stopSpeak();if(cleanup){try{cleanup()}catch(e){}cleanup=null}
 const h=(location.hash||'#home').slice(1);const k=h.indexOf('-');const name=k>0?h.slice(0,k):h,arg=k>0?h.slice(k+1):'';
 (VIEWS[name]||viewHome)(arg);window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
 const s=e.target.closest('[data-say]');if(s){speak(s.dataset.say);return}
 const l=e.target.closest('[data-learn]');if(l){const id=l.dataset.learn;if(!S.learned[id]){S.learned[id]=1;save();addStars(3,'Mission learned!');award('learn-'+id);l.className='btn big done';l.textContent='✅ Mission learned!'}return}
});
$('#readBtn').onclick=()=>{try{if(speechSynthesis.speaking){stopSpeak();return}}catch(e){}const txt=$$('#app h1, #app h2, #app h3, #app p, #app li, #app .caption').filter(el=>el.offsetParent!==null&&!el.closest('.vcard')).map(el=>el.textContent.replace(/🔊/g,'').trim()).filter(Boolean).map(t=>/[.!?]$/.test(t)?t:t+'.').join(' ');speak(txt)};
$('#voiceBtn').onclick=()=>{const vs=englishVoices();const m=modal(`<h2>🎙️ Choose the voice</h2><p>These voices come from this device. The ones at the top (with ⭐) sound the most like a real person. Tap <b>Try</b> to listen, then <b>Use</b>.</p><div style="max-height:46vh;overflow:auto">${vs.length?vs.slice(0,15).map((v,i)=>`<div class="chal" style="justify-content:space-between"><span>${i<3?'⭐ ':''}${esc(v.name)} <small class="muted">(${v.lang})</small>${voice&&voice.name===v.name?' <b>✅ in use</b>':''}</span><span class="row gap"><button class="btn sm grey" data-try="${i}">▶ Try</button><button class="btn sm green" data-use="${i}">Use</button></span></div>`).join(''):'<p>No English voices found on this device yet. Try reloading the page.</p>'}</div><p><b>Speed:</b> <input type="range" id="rateIn" min="0.75" max="1.15" step="0.05" value="${S.rate||.95}" class="slider" style="max-width:260px;vertical-align:middle"></p><p class="muted" style="font-size:15px">💡 For the most human voice: on iPhone/iPad go to Settings → Accessibility → Spoken Content → Voices → English, and download an <b>Enhanced</b> or <b>Premium</b> voice. On Windows, Microsoft Edge has very natural "Online (Natural)" voices. In Chrome, "Google UK English" voices sound good.</p><div class="center"><button class="btn big" data-close>Done</button></div>`);
 $$('[data-try]',m).forEach(b=>b.onclick=()=>{const v=vs[+b.dataset.try];const keep=voice;voice=v;speak(`Hello ${pname()}! I am your flight instructor. Let's learn to fly together!`);voice=keep});
 $$('[data-use]',m).forEach(b=>b.onclick=()=>{const v=vs[+b.dataset.use];voice=v;S.voice=v.name;save();speak(`Great choice! I will be your voice from now on, ${pname()}.`);m.remove();$('#voiceBtn').click()});
 $('#rateIn',m).oninput=e=>{S.rate=+e.target.value;save()};};
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();if(!S.sound)stopSpeak()};
renderTop();route();
if(!S.name)setTimeout(()=>askName(false),400);
</script>
</body>
</html>
