<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Junior Pilot Academy · Sign in</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#12324f;background:linear-gradient(180deg,#46aef0 0%,#9fdcff 45%,#e6f6ff 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:22px;padding:28px 26px;width:100%;max-width:400px;box-shadow:0 6px 0 rgba(18,50,79,.12),0 10px 24px rgba(18,50,79,.12);text-align:center}
.plane{font-size:56px;line-height:1}
h1{margin:.2em 0 .1em;font-size:28px;color:#1d3f72}
p{margin:.3em 0 1em;color:#3d5a78}
label{display:block;text-align:left;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid #b9dcf7;border-radius:12px;outline:none}
input:focus{border-color:#5ec2ff}
.rem{display:flex;gap:8px;align-items:center;justify-content:flex-start;font-weight:500;margin-top:12px}
button{margin-top:16px;width:100%;font:inherit;font-size:20px;font-weight:800;padding:13px;border:0;border-radius:14px;background:#ffc93c;color:#12324f;box-shadow:0 5px 0 #d9a21c;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #d9a21c}
button:disabled{opacity:.6}
.err{color:#c0262f;font-weight:700;min-height:1.4em;margin-top:10px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off" hidden>
  <div class="plane" aria-hidden="true">✈️</div>
  <h1>Junior Pilot Academy</h1>
  <p>Sign in to start your flight training, Captain!</p>
  <label for="u">Username</label><input id="u" type="text" autocapitalize="none" spellcheck="false" required>
  <label for="p">Password</label><input id="p" type="password" required>
  <label class="rem"><input id="r" type="checkbox"> Remember me on this computer</label>
  <button id="go" type="submit">Take off ✈️</button>
  <div class="err" id="e" role="alert"></div>
</form>
